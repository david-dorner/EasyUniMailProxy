# Dovecot: the IMAP server the mail clients connect to. Self-contained config
# (no conf.d includes) so the whole client-facing behaviour is in one file.
#
# Phase 1 scope: terminate the client's TLS with our own certificate, log the
# user in against a local user file, and serve their local Maildir. The Maildir
# is filled from the university mailbox by the sync engine in a later phase.

protocols = imap
listen = *

# Logs to the container's stderr so `docker compose logs mail` shows them.
log_path = /dev/stderr
info_log_path = /dev/stderr

# ── TLS: our own certificate (see cert.sh / CERT_MODE) ──
ssl = required
ssl_cert = </certs/fullchain.pem
ssl_key = </certs/key.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

# ── Where each user's mail lives ──
mail_location = maildir:/mail/%u/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  inbox = yes
  separator = /
}

# ── Authentication ──
# Never accept credentials without TLS. The client logs in with its university
# address; the password is checked against the local user file, whose hashes are
# written by the entrypoint (Argon2/CRYPT). Real per-user provisioning and at-rest
# encryption arrive in later phases.
disable_plaintext_auth = yes
auth_mechanisms = plain login
# Allow every character in the submitted username (empty = no filtering), so the
# "bzedvz\name@edu.uni-graz.at" form with a backslash reaches our auth backend,
# which normalizes it. The backend rewrites USER to the canonical address.
auth_username_chars =

# checkpassword backend: enroll-on-first-login + local verify (see authcheck.py).
passdb {
  driver = checkpassword
  args = /usr/local/bin/authcheck.py
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/mail/%u
}

# ── Listeners: IMAPS on 993 only (no cleartext IMAP on 143) ──
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# SASL auth socket for Postfix: the submission service (587) verifies the user's
# credentials against Dovecot through this socket, so IMAP and SMTP share one
# user database. Postfix (non-chroot) reads it at /var/spool/postfix/private/auth.
service auth {
  # checkpassword (authcheck.py) is forked from the auth process, so the auth
  # process must have the privileges the script needs: read the master key, write
  # the per-user credential store, and create mailboxes (it then hands ownership
  # to the mail user). (Phase 4 hardening replaces this with a least-privilege
  # enrollment helper.)
  user = root
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
